# =============================================================================
# 智课平台 · 学生 PC 端 Nginx 配置（同域部署）
# -----------------------------------------------------------------------------
# 目标：前端静态资源、/api、/ws、/files 全部由【同一个 origin】提供，
#       前端用相对路径请求，用户只打开一个网址，不需要任何地址配置。
#
# 部署路径：
#   静态产物  dist/  →  /data/www/student/   （build 时 base=/student/）
#   后端               →  http://127.0.0.1:8080
#   访问地址           →  https://<域名>/student/
#
# ★ 必须用 HTTPS，不能用 http://IP:8080 裸端口：
#   教师端共享屏幕调用 getDisplayMedia()，属 secure-context-only API，
#   非 https（且非 localhost）时 navigator.mediaDevices 为 undefined，按钮点了直接报错。
#
# 用法：把 <域名> 替换成实际域名，证书路径按实际填写，然后
#   nginx -t && nginx -s reload
# =============================================================================

# ---------- HTTP 全量跳 HTTPS（教师端抓屏强制要求 https） ----------
server {
    listen 80;
    listen [::]:80;
    server_name <域名>;

    # Let's Encrypt 续期校验路径，必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <域名>;

    ssl_certificate     /etc/nginx/ssl/<域名>.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/<域名>.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传体积上限（聊天图片、作业/实验附件）
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 根路径重定向到学生端 ----------
    location = / {
        return 302 /student/;
    }

    # ---------- 学生端静态资源（vite build base=/student/） ----------
    # root + 不带尾斜杠的潜规则：实际文件位于 /data/www/student/
    location /student/ {
        root /data/www;
        # hash 路由：只有 index.html 需要兜底，其余都是真实文件
        try_files $uri $uri/ /student/index.html;

        # index.html 不缓存，否则发版后用户仍加载旧 JS（缓存了旧 chunk 会白屏）
        location = /student/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 带 hash 的静态资源可长期缓存（文件名含内容哈希）
    location /student/assets/ {
        root /data/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 业务接口 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 答疑 / 学情解读可能较慢
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- WebSocket（实时课堂 /ws/session/{sid}、投屏 /ws/cast/{sid}） ----------
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 关键：一节课 90 分钟，默认 60s 空闲超时会把长连接掐断，
        #   表现为学生端每隔一分钟重连、课堂事件丢失。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---------- 上传文件静态目录（/files/** → 后端 ResourceWebConfig） ----------
    location /files/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ---------- 若依统一鉴权入口（不带 /api 前缀） ----------
    # 精确匹配，避免误伤 /loginhelp 之类的路径
    location ~ ^/(login|logout|getInfo|captchaImage|register)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 健康检查（供运维探活，不暴露业务数据） ----------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
